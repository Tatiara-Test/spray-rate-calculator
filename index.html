<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#236b38" />
    <meta name="description" content="Offline spray calculations, paddock records and work notes for Pallathorpe Enterprises." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./release-v33-20260928/brand-mark.png" />
    <link rel="apple-touch-icon" href="./release-v33-20260928/brand-mark.png" />
    <link rel="stylesheet" href="./release-v33-20260928/styles/shell.css" />
    <link rel="stylesheet" href="./release-v33-20260928/styles/appearance.css" />
    <link rel="stylesheet" href="./release-v33-20260928/styles/notebook.css" />
    <link rel="stylesheet" href="./release-v33-20260928/styles/servicing-log.css" />
    <link rel="stylesheet" href="./release-v33-20260928/styles/service-workflow.css" />
    <link rel="stylesheet" href="./release-v33-20260928/styles/service-template-report.css" />
    <title>Farmhand 0.8 — Tatiara TEST</title>
  </head>
  <body>
    <aside class="test-channel-banner" aria-label="Test edition"><strong>TATIARA TEST</strong><span>Farmhand 0.8 · Records are stored in this browser. Keep regular backup files.</span></aside>
    <aside id="migration-notice" class="notice" hidden role="status"></aside>
    <aside id="navigation-warning" class="notice" hidden role="alert"></aside>
    <aside id="update-banner" class="update-banner" hidden>
      <span><strong>New version ready</strong><small>Your current work will stay open until you choose to update.</small></span>
      <button id="update-now" type="button">Update now</button>
    </aside>

    <nav id="section-navigation" class="section-navigation" aria-label="Current section" hidden>
      <div class="section-navigation-inner">
        <button id="main-menu-button" type="button"><span aria-hidden="true">⌂</span><span>Main menu</span></button>
        <strong id="current-section-title"></strong>
      </div>
    </nav>

    <main id="combined-app">
      <section class="combined-panel home-panel" data-panel="home" aria-labelledby="main-menu-heading">
        <div class="home-shell">
          <header class="home-header">
            <img class="farmer-assistant-emblem" src="./release-v33-20260928/farmers-assistant-emblem.png" alt="Farmer’s Assistant FH emblem" width="72" height="72" />
            <div><p id="home-farm-name">Pallathorpe Enterprises</p><h1 id="main-menu-heading">What would you like to do?</h1></div>
          </header>
          <button id="continue-button" class="continue-card" type="button">
            <span>Continue where you left off</span>
            <strong id="continue-title">Continue Spray Operations</strong>
            <small id="continue-detail">Calculator</small>
          </button>
          <button id="active-work-button" class="active-work-card" type="button" hidden><span id="active-work-title"></span><small id="active-work-detail"></small></button>
          <div class="home-card-grid" aria-label="App sections">
            <button class="home-card" type="button" data-open-section="spray">
              <span class="home-card-icon" aria-hidden="true">∑</span>
              <span><strong>Spray Operations</strong><small>Calculate a tank mix and save it to a paddock.</small></span>
              <b aria-hidden="true">›</b>
            </button>
            <button class="home-card" type="button" data-open-section="weather">
              <span class="home-card-icon" aria-hidden="true">↗</span>
              <span><strong>Weather Shortcuts</strong><small>Open your saved weather websites without a built-in forecast.</small></span>
              <b aria-hidden="true">›</b>
            </button>
            <button class="home-card" type="button" data-open-section="work-notes" data-open-tab="notes">
              <span class="home-card-icon" aria-hidden="true">✓</span>
              <span><strong>Work Diary</strong><small>Daily work entries and period summaries for wages.</small></span>
              <b aria-hidden="true">›</b>
            </button>
            <button class="home-card" type="button" data-open-section="work-notes" data-open-tab="followups">
              <span class="home-card-icon" aria-hidden="true">✓</span><span><strong>To-do list <span id="home-todo-count"></span></strong><small>Jobs that need doing.</small></span><b aria-hidden="true">›</b>
            </button>
            <button class="home-card" type="button" data-open-section="notebook">
              <span class="home-card-icon" aria-hidden="true">▤</span><span><strong>Notebook</strong><small>Keep information, notes and named checklists.</small></span><b aria-hidden="true">›</b>
            </button>
            <button class="home-card" type="button" data-open-section="servicing">
              <span class="home-card-icon servicing-home-icon" aria-hidden="true">⚙</span>
              <span><strong>4830 Servicing</strong><small>Existing model-specific checklist and service records.</small></span>
              <b aria-hidden="true">›</b>
            </button>
            <button class="home-card" type="button" data-open-section="service-workspace">
              <span class="home-card-icon" aria-hidden="true">⚙</span>
              <span><strong>Equipment &amp; service templates</strong><small>Equipment register, service logs and editable checklists.</small></span><b aria-hidden="true">›</b>
            </button>
            <button class="home-card" type="button" data-open-section="settings">
              <span class="home-card-icon" aria-hidden="true">⚙</span>
              <span><strong>Settings</strong><small>Manage farm details, protect your records and learn how to use the app.</small></span>
              <b aria-hidden="true">›</b>
            </button>
          </div>
          <button id="home-backup-all-records" class="home-backup-button" type="button">Back up all records</button>
          <p class="home-backup-help">Create a backup file to keep somewhere safe.</p>
        </div>
      </section>
      <section class="combined-panel" data-panel="spray" aria-label="Spray Operations" hidden>
        <div id="spray-host"></div>
      </section>
      <section class="combined-panel" data-panel="weather" aria-label="Weather Shortcuts" hidden>
        <div id="weather-host"></div>
      </section>
      <section class="combined-panel" data-panel="work-notes" aria-label="Work Diary" hidden>
        <div id="work-notes-host"></div>
      </section>
      <section class="combined-panel" data-panel="notebook" aria-label="Notebook" hidden><div id="notebook-host"></div></section>
      <section class="combined-panel" data-panel="servicing" aria-label="Servicing" hidden>
        <div id="servicing-host"></div>
      </section>
      <section class="combined-panel" data-panel="service-workspace" aria-label="Equipment and service templates" hidden><div id="service-workspace-host"></div></section>
      <section class="combined-panel" data-panel="settings" aria-label="Settings" hidden>
        <div id="settings-host"></div>
      </section>
    </main>

    <script type="module" src="./release-v33-20260928/bootstrap.mjs"></script>
  </body>
</html>
